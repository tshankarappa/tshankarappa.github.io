<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rent Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 1rem;
            background: #f9f9f9;
            color: #333;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
        }

        label {
            font-weight: 500;
            display: block;
            margin: 1rem 0 0.25rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .tooltip {
            display: inline-block;
            position: relative;
            cursor: help;
        }

        .tooltip:hover::after {
            content: "Use formats like: Every 3 years from Year 7 to Year 14: 12%. In Years 15,16,17: 20%";
            white-space: pre-wrap;
            position: absolute;
            left: 0;
            top: 2em;
            background: #eef6ff;
            border: 1px solid #007bff;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            width: 340px;
            line-height: 1.4;
            z-index: 10;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            background: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 0.5rem;
            text-align: center;
        }

        th {
            background-color: #f1f1f1;
        }

        /* Custom column widths */
        th:nth-child(1),
        td:nth-child(1) {
            width: 10px;
            /* Year */
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 40px;
            /* % Increase */
        }

        tfoot td {
            font-weight: bold;
            background: #fafafa;
        }

        @media (max-width: 600px) {
            body {
                font-size: 0.95rem;
            }

            th,
            td {
                font-size: 0.85rem;
                padding: 0.4rem;
            }

            th:nth-child(1),
            td:nth-child(1),
            th:nth-child(2),
            td:nth-child(2) {
                min-width: 20px;
                max-width: 30px;
            }
            th:nth-child(3),
            td:nth-child(3) {
                min-width: 45px;
                max-width: 45px;
            }

            .tooltip:hover::after {
                width: 90vw;
            }
        }

        .table-container {
            max-width: 800px;
            /* or 700px if you want it tighter */
            margin: 0 auto;
            padding: 16px;
            overflow-x: auto;
            /* still allow scroll on small screens */
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div class="table-container">
        <h1>Rent Calculator</h1>

        <label> Start Year </label>
        <input type="number" id="startYear" value="2025" />

        <label>Rent per sq.ft per month (₹)</label>
        <input type="number" id="baseRent" value="3.6731" step="0.01" />

        <label>Total lease years</label>
        <input type="number" id="totalYears" value="40" />

        <label>Rent-free years at beginning</label>
        <input type="number" id="rentFree" value="2" />

        <label>
            Escalation rules
            <span class="tooltip">ℹ️</span>
        </label>
        <textarea id="escalationRules" rows="6">Every 3 years from Year 6 to Year 40: 13%
</textarea>

        <button onclick="calculate()">Calculate</button>

        <table id="rentTable">
            <thead>
                <tr>
                    <th colspan="2">Year</th>
                    <th>%</th>
                    <th>₹ / sq.ft</th>
                    <th>Monthly Rent / Acre</th>
                    <th>Yearly Rent / Acre</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total Rent</td>
                    <td id="totalRent" colspan="3"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script>
        function formatINR(num) {
            return '₹ ' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
        }

        function parseRules(rulesText) {
            const rules = [];
            const lines = rulesText.split(/[\n;]+/).map(l => l.trim()).filter(Boolean);
            lines.forEach(line => {
                const percentMatch = line.match(/(\d+(?:\.\d+)?)%/);
                const percent = percentMatch ? parseFloat(percentMatch[1]) : 0;

                if (line.startsWith("Every")) {
                    const startMatch = line.match(/from Year (\d+)/);
                    const intervalMatch = line.match(/Every (\d+)/);
                    const untilMatch = line.match(/to Year (\d+)/);
                    const interval = intervalMatch ? parseInt(intervalMatch[1]) : 3;
                    const start = startMatch ? parseInt(startMatch[1]) : 1;
                    const end = untilMatch ? parseInt(untilMatch[1]) : 100;
                    for (let y = start; y <= end; y += interval) {
                        rules.push({ year: y, percent });
                    }
                } else if (line.startsWith("In Year") || line.startsWith("In Years")) {
                    const yearMatch = line.match(/Years? ([\d, ]+)/);
                    if (yearMatch) {
                        const years = yearMatch[1].split(",").map(v => parseInt(v.trim()));
                        years.forEach(y => rules.push({ year: y, percent }));
                    }
                }
            });
            return rules;
        }
        function calculate() {
            const base = parseFloat(document.getElementById("baseRent").value);
            const years = parseInt(document.getElementById("totalYears").value);
            const rentFree = parseInt(document.getElementById("rentFree").value);
            const rulesText = document.getElementById("escalationRules").value;

            const rules = parseRules(rulesText);
            const escalationMap = {};
            rules.forEach(r => escalationMap[r.year] = r.percent);

            const table = document.querySelector("#rentTable tbody");
            const totalRentCell = document.getElementById("totalRent");
            table.innerHTML = "";

            let currentRate = base;
            let total = 0;

            for (let y = 1; y <= years; y++) {

                let percentIncrease = "";

                // Apply escalation even during rent-free years to keep the rate updated
                if (escalationMap[y]) {
                    currentRate += (currentRate * escalationMap[y]) / 100;
                    percentIncrease = escalationMap[y] + "%";
                }
                let rateThisYear = currentRate;
                // If rent-free, set rent to zero for this year
                if (y <= rentFree) {
                    rateThisYear = 0;
                }

                const monthly = rateThisYear * 43560;
                const yearly = monthly * 12;

                table.innerHTML += `
      <tr>
        <td>${y}</td>
        <td>${y + parseInt(document.getElementById("startYear").value) - 1}</td>
        <td>${percentIncrease}</td>
        <td>${formatINR(rateThisYear)}</td>
        <td>${formatINR(monthly)}</td>
        <td>${formatINR(yearly)}</td>

      </tr>
    `;

                total += yearly;
            }

            totalRentCell.textContent = formatINR(total);
        }

        window.onload = calculate;
    </script>

</body>

</html>
